<style>
/* Layout: menu lateral escuro fixo + área de conteúdo; o Painel é escuro
   (executivo) e os módulos operacionais são claros, como pede o §6 do
   Documento Mestre. Visual único e deliberado: não segue o tema do sistema. */
:root {
  color-scheme: dark;
  --ink-0: #0b0a08;        /* preto do menu */
  --graphite: #17161a;     /* grafite dos painéis escuros */
  --graphite-2: #222127;
  --line-dark: #34312b;
  --gold: #b8943e;         /* dourado metálico discreto */
  --gold-hi: #d9bc74;
  --paper: #f3f2ef;        /* fundo dos módulos claros */
  --card: #ffffff;
  --line: #dedbd3;
  --text: #1d1b17;
  --text-2: #5b574d;
  --text-dark: #efeae0;
  --text-dark-2: #a39d90;
  --good: #2f7d4f;
  --info: #2b5fa6;
  --warn: #a35a1f;
  --bad: #a3282b;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ink-0); color: var(--text-dark); font-family: var(--body); font-size: 14px; }
button, input, select, textarea { font: inherit; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: .92em; }

.app { display: flex; min-height: 100%; }
.side {
  width: 236px; flex: none; background: var(--ink-0); border-right: 1px solid var(--line-dark);
  padding: 18px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand-mark { width: 30px; height: 30px; border: 1.5px solid var(--gold); border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; color: var(--gold-hi); font-size: 14px; }
.brand b { font-family: var(--display); font-weight: 800; letter-spacing: .02em; font-size: 16px; }
.brand b span { color: var(--gold-hi); }
.ctx { display: grid; gap: 8px; }
.ctx label { display: grid; gap: 4px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dark-2); }
.ctx select { width: 100%; min-width: 0; background: var(--graphite-2); color: var(--text-dark); border: 1px solid var(--line-dark); border-radius: 8px; padding: 7px 8px; font-size: 12.5px; }
.ctx select:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.nav-sec { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dark-2); padding: 0 10px 4px; }
.nav { display: grid; gap: 2px; }
.nav button {
  text-align: left; border: 0; background: transparent; color: var(--text-dark-2); padding: 8px 10px; border-radius: 8px;
  cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 13.5px;
}
.nav button:hover { background: var(--graphite-2); color: var(--text-dark); }
.nav button.on { background: var(--gold); color: #12100c; font-weight: 600; }
.nav button:focus-visible { outline: 2px solid var(--gold-hi); }
.nav .count { margin-left: auto; font-size: 10.5px; background: var(--bad); color: #fff; border-radius: 99px; padding: 1px 6px; }
.side-foot { margin-top: auto; font-size: 11px; color: var(--text-dark-2); padding: 0 8px; line-height: 1.5; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px;
  background: var(--ink-0); border-bottom: 1px solid var(--line-dark);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink-0); }
.burger { display: none; background: none; border: 1px solid var(--line-dark); color: var(--text-dark); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; }
.demo-tag { font-size: 11.5px; color: var(--gold-hi); border: 1px solid var(--line-dark); border-radius: 99px; padding: 3px 10px; }
.who { margin-left: auto; font-size: 12px; color: var(--text-dark-2); text-align: right; }
.who b { color: var(--text-dark); font-weight: 600; display: block; }

.view { flex: 1; padding-block: 22px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view.light { background: var(--paper); color: var(--text); }
.view.dark { background: var(--graphite); color: var(--text-dark); }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 18px; }

.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head h1 { font-family: var(--display); font-weight: 800; font-size: 26px; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--text-2); font-size: 13px; }
.dark .head p { color: var(--text-dark-2); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.dark .card { background: var(--graphite-2); border-color: var(--line-dark); }
.card h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin: 0 0 12px; font-weight: 600; }
.dark .card h2 { color: var(--gold-hi); }
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g21 { grid-template-columns: 2fr 1fr; }
.kpi .lbl { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); }
.dark .kpi .lbl { color: var(--text-dark-2); }
.kpi .val { font-family: var(--display); font-weight: 700; font-size: 26px; margin-top: 4px; }
.kpi .sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.dark .kpi .sub { color: var(--text-dark-2); }

.btn { border: 1px solid var(--gold); background: var(--gold); color: #14110b; font-weight: 600; font-size: 12.5px; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.btn:hover { background: var(--gold-hi); }
.btn.ghost { background: transparent; color: inherit; border-color: var(--line); }
.dark .btn.ghost { border-color: var(--line-dark); }
.btn.ghost:hover { border-color: var(--gold); }
.btn.danger { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); }
table { width: 100%; border-collapse: collapse; min-width: 620px; color: inherit; font-size: inherit; }
th { text-align: left; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px dashed var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #faf8f3; }
.link { color: var(--gold); font-weight: 600; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--mono); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; border-radius: 99px; padding: 2px 9px; border: 1px solid; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-good { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); background: color-mix(in srgb, var(--good) 8%, transparent); }
.p-info { color: var(--info); border-color: color-mix(in srgb, var(--info) 35%, transparent); background: color-mix(in srgb, var(--info) 8%, transparent); }
.p-warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); }
.p-bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); background: color-mix(in srgb, var(--bad) 8%, transparent); }
.p-neutral { color: var(--text-2); border-color: var(--line); background: #f7f6f2; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.tabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--text-2); font-weight: 600; font-size: 12.5px; }
.tabs button.on { background: var(--text); color: var(--paper); }

.form { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.f { display: grid; gap: 4px; font-size: 12px; color: var(--text-2); min-width: 0; }
.f input, .f select, .f textarea { border: 1px solid var(--line); background: #fbfaf7; border-radius: 8px; padding: 8px 9px; color: var(--text); width: 100%; min-width: 0; }
.span2 { grid-column: span 2; } .span3 { grid-column: 1 / -1; }

.note { font-size: 12.5px; color: var(--text-2); line-height: 1.5; }
.alert { border-radius: 10px; padding: 10px 12px; font-size: 13px; border: 1px solid; }
.alert.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); background: color-mix(in srgb, var(--bad) 6%, transparent); }
.alert.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); background: color-mix(in srgb, var(--good) 6%, transparent); }
.alert.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); background: color-mix(in srgb, var(--warn) 6%, transparent); }

.steps { display: flex; flex-wrap: wrap; gap: 0; }
.step { flex: 1 1 0; min-width: 92px; padding: 10px 8px 0; border-top: 3px solid var(--line); font-size: 11.5px; color: var(--text-2); }
.step.done { border-color: var(--gold); color: var(--text); }
.step.now { border-color: var(--text); color: var(--text); font-weight: 600; }

.bars { display: flex; align-items: flex-end; gap: 10px; height: 170px; }
.bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; font-size: 11px; color: var(--text-dark-2); min-width: 0; }
.bar i { display: block; width: 100%; max-width: 46px; background: var(--gold); border-radius: 4px 4px 0 0; min-height: 2px; }
.bar.cur i { background: var(--gold-hi); }
.bar .v { color: var(--text-dark); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hbar { display: grid; gap: 4px; }
.hbar .l { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; }
.hbar .t { height: 6px; background: var(--line-dark); border-radius: 3px; overflow: hidden; }
.hbar .t i { display: block; height: 100%; background: var(--gold); }
.list { display: grid; gap: 10px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--text-2); } .kv dd { margin: 0; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 12.5px; }
.timeline li { border-left: 2px solid var(--gold); padding-left: 10px; }
.timeline small { color: var(--text-2); display: block; }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink-0); color: var(--text-dark); border: 1px solid var(--gold); border-radius: 10px; padding: 10px 14px; font-size: 13px; z-index: 30; max-width: 360px; }

.portal-top { background: var(--ink-0); color: var(--text-dark); border-radius: 12px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }

@media (max-width: 980px) {
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g21, .g3 { grid-template-columns: 1fr; }
  .form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .side { position: fixed; z-index: 20; left: 0; top: 0; transform: translateX(-100%); transition: transform .2s; }
  .side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); }
  .burger { display: grid; place-items: center; }
  .who { display: none; }
  .g2, .g4 { grid-template-columns: 1fr 1fr; }
  .form { grid-template-columns: 1fr; }
  .span2 { grid-column: auto; }

@media (max-width: 440px) { .g4, .g2 { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }
</style>

function explode(item) {
  const p = prod(item.sku);
  return p.kit ? p.kit.map(([s, q]) => [s, q * item.qty]) : [[item.sku, item.qty]];
}
function move(type, sku, qty, doc, key) {
  const c = C();
  if (key && c.moves.some((m) => m.key === key)) return false; // idempotência: mesma chave não movimenta de novo
  const p = prod(sku);
  if (type === "Reserva") { if (availSimple(p) < qty) throw new Error(`Saldo insuficiente de ${sku} para reservar ${qty}.`); p.res += qty; }
  if (type === "Liberação") p.res -= qty;
  if (type === "Saída") { p.res -= qty; p.phys -= qty; }
  if (type === "Entrada") p.phys += qty;
  if (type === "Bloqueio") { if (availSimple(p) < qty) throw new Error("Saldo insuficiente para bloquear."); p.blk += qty; }

    items: items.map(([sku, qty, price, disc]) => ({ sku, qty, price, disc })), freight: opts.freight || 0, discount: 0,
    inst: opts.inst || 1, events: [], created: now(), carrier: "", tracking: "",

}
function log(o, msg) { o.events.unshift({ when: now(), who: role().user, msg }); }

  for (const [s, q] of Object.entries(need)) if (availSimple(prod(s)) < q) throw new Error(`Saldo insuficiente de ${s}: precisa ${q}, disponível ${availSimple(prod(s))}.`);

function activeDoc(o) { return C().docs.find((d) => d.order === o.id && d.status !== "Cancelada"); }
function accessKey(c, n) {
  const base = `35${new Date().toISOString().slice(2, 4)}${new Date().toISOString().slice(5, 7)}${c.code === "A" ? "11222333000181" : "44555666000171"}55001${String(n).padStart(9, "0")}1${String(Math.floor(Math.random() * 1e8)).padStart(8, "0")}`;

      <td class="r num">${money(i.sub)}</td><td><button class="btn ghost" data-rm="${idx}">Remover</button></td></tr>`; }), "Digite um SKU acima e tecle Enter.")}</div>

      ${reasons.length ? `<div class="alert warn" style="margin-top:8px">Vai para aprovação: ${esc(reasons.join("; "))}.</div>` : d.items.length ? `<div class="alert good" style="margin-top:8px">Dentro dos limites: será aprovada automaticamente ao enviar.</div>` : ""}</div>
    <div class="row"><button class="btn ghost" data-act="descartar">Descartar</button><button class="btn" data-act="salvar" ${d.items.length ? "" : "disabled"}>Salvar cotação</button></div>
  </div></div>`;
}

function vPedido() {
  const o = C().orders.find((x) => x.id === S.orderId);
  if (!o || (role().own && o.seller !== role().user)) { S.orderId = null; return `<div class="alert bad">Pedido não encontrado nesta empresa.</div>`; }
  const d = activeDoc(o); const st = o.status; const isApprover = role().approve || S.role === "MEDIATOR";
  const fiscalOk = ["MEDIATOR","FISCAL"].includes(S.role); const stockOk = ["MEDIATOR","STOCK"].includes(S.role);
  const sellerOk = ["MEDIATOR","MANAGER","SALES_MANAGER","SELLER"].includes(S.role);
  const acts = [];
  if (st === "COTACAO" && sellerOk) acts.push(`<button class="btn" data-o="submit">Enviar pedido</button>`);
  if (st === "AGUARDANDO" && isApprover) acts.push(`<button class="btn" data-o="approve">Aprovar</button>`);
  if (FLOW.indexOf(st) >= 2 && st !== "CANCELADO" && !d && fiscalOk) acts.push(`<button class="btn" data-o="nf">Emitir NF-e</button>`);
  const next = { APROVADO: ["SEPARACAO", "Iniciar separação"], SEPARACAO: ["CONFERENCIA", "Concluir separação"], CONFERENCIA: ["PRONTO", "Conferir e embalar"], PRONTO: ["ENVIADO", "Despachar"], ENVIADO: ["ENTREGUE", "Confirmar entrega"] }[st];
  if (next && stockOk) acts.push(`<button class="btn ghost" data-o="adv" data-to="${next[0]}">${next[1]}</button>`);
  const canCancel = sellerOk && FLOW.indexOf(st) < FLOW.indexOf("ENVIADO") && st !== "CANCELADO";
  const recv = C().recv.filter((r) => r.order === o.id);
  const stepIdx = FLOW.indexOf(st);
  return `<div class="row"><button class="btn ghost" data-act="voltar">Voltar aos pedidos</button></div>` +
    head(`Pedido ${code(o)}`, `${esc(cust(o.customer).name)} · vendedor ${esc(o.seller)} · ${esc(o.channel)}`, pill(STATUS[st])) +
    (st !== "CANCELADO" ? `<div class="steps">${["Cotação","Aprovação","Aprovado","Separação","Conferência","Pronto","Enviado","Entregue"].map((l, i) => `<div class="step ${i < stepIdx ? "done" : i === stepIdx ? "now" : ""}">${l}</div>`).join("")}</div>` : "") +
    `<div class="card"><div class="row" style="justify-content:space-between"><div class="row">${acts.join("") || `<span class="note">Nenhuma ação disponível para o perfil ${esc(role().label)} nesta etapa.</span>`}</div>
      ${canCancel ? `<div class="row"><label class="f" for="cancel-reason" style="min-width:200px">Motivo do cancelamento<input id="cancel-reason" placeholder="obrigatório"></label><button class="btn danger" data-o="cancel" style="align-self:flex-end">Cancelar pedido</button></div>` : ""}</div>
      <div id="err"></div>
      ${st === "AGUARDANDO" ? `<div class="alert warn" style="margin-top:10px">Motivo da aprovação: ${esc((o.reasons || []).join("; "))}.</div>` : ""}
      ${o.approvedAt ? `<p class="note" style="margin:10px 0 0">Aprovação: <b>${esc(o.approvedBy)}</b> em ${o.approvedAt}.</p>` : ""}
    </div>
    <div class="grid g21">
      <div>${table([{ t: "SKU" }, { t: "Produto" }, { t: "Qtd", r: 1 }, { t: "Preço", r: 1 }, { t: "Desc.", r: 1 }, { t: "Subtotal", r: 1 }].concat(seeCosts() ? [{ t: "Margem", r: 1 }] : []),
        o.items.map((i) => { const p = prod(i.sku); const cost = p.kit ? p.kit.reduce((s, [k, q]) => s + q * prod(k).cost, 0) : p.cost; return `<tr><td class="mono">${i.sku}</td><td>${esc(p.name)}${p.kit ? `<br><small class="note">baixa ${p.kit.map(([k, q]) => `${q * i.qty} × ${k}`).join(", ")}</small>` : ""}</td><td class="r num">${nf.format(i.qty)}</td><td class="r num">${money(i.price)}</td><td class="r num">${i.disc}%</td><td class="r num">${money(i.sub)}</td>${seeCosts() ? `<td class="r num">${(((i.sub - cost * i.qty) / i.sub) * 100).toFixed(0)}%</td>` : ""}</tr>`; }))}
        <p class="note" style="text-align:right">Itens ${money(o.itemsTotal)} · frete ${money(o.freight)} · <b style="color:var(--text)">total ${money(o.total)}</b> em ${o.inst}x</p></div>
      <div class="grid">
        <div class="card"><h2>Fiscal</h2>${d ? `<dl class="kv"><dt>NF-e</dt><dd class="num">${d.n} · série 1</dd><dt>Status</dt><dd>${pill(["Autorizada", "p-good"])}</dd><dt>Chave</dt><dd class="mono" style="word-break:break-all">${d.key}</dd></dl><p class="note">Homologação: sem valor fiscal.</p>` : `<p class="note">Sem nota emitida.</p>`}</div>
        <div class="card"><h2>Contas a receber</h2>${recv.length ? `<div class="list">${recv.map((r) => `<div class="hbar"><div class="l"><span>${r.inst} · vence ${fdate(r.due)}</span><span class="num">${money(r.amount)} ${pill(recvStatus(r))}</span></div></div>`).join("")}</div>` : `<p class="note">Geradas quando a NF-e é autorizada.</p>`}</div>
        ${o.tracking ? `<div class="card"><h2>Expedição</h2><dl class="kv"><dt>Transportadora</dt><dd>${esc(o.carrier)}</dd><dt>Rastreio</dt><dd class="mono">${esc(o.tracking)}</dd></dl></div>` : ""}
      </div>
    </div>
    <div class="card"><h2>Histórico do pedido</h2><ol class="timeline">${o.events.map((e) => `<li>${esc(e.msg)}<small>${e.when} · ${esc(e.who)}</small></li>`).join("")}</ol></div>`;
}

function vProdutos() {
  return head("Produtos e kits", `${C().products.length} SKUs · ${esc(C().name)}`, `<span class="note">${["MEDIATOR","MANAGER","SALES_MANAGER"].includes(S.role) ? "Seu perfil pode alterar preços." : "Seu perfil não altera preço nem custo."}</span>`) +
    table([{ t: "SKU" }, { t: "Produto" }, { t: "Família" }, { t: "Tipo" }, { t: "NCM" }, { t: "Preço", r: 1 }, { t: "Preço mín.", r: 1 }].concat(seeCosts() ? [{ t: "Custo", r: 1 }] : []).concat([{ t: "Disponível", r: 1 }]),
      C().products.map((p) => `<tr><td class="mono">${p.sku}</td><td>${esc(p.name)}${p.kit ? `<br><small class="note">composição: ${p.kit.map(([k, q]) => `${q} × ${k}`).join(", ")}</small>` : ""}</td><td>${p.fam}</td><td>${p.kit ? pill(["Kit", "p-info"]) : "Unidade"}</td><td class="mono">${p.ncm}</td><td class="r num">${money(p.price)}</td><td class="r num">${money(p.min)}</td>${seeCosts() ? `<td class="r num">${p.kit ? "-" : money(p.cost)}</td>` : ""}<td class="r num">${nf.format(avail(p))}</td></tr>`)) +

}

function vEstoque() {
  const tab = S.tab === "mov" ? "mov" : "saldos";
  const canMove = ["MEDIATOR","STOCK"].includes(S.role);
  return head("Estoque", `Físico, reservado, bloqueado e disponível · ${esc(C().name)}`) +
    `<div class="tabs"><button data-tab="saldos" class="${tab === "saldos" ? "on" : ""}">Saldos</button><button data-tab="mov" class="${tab === "mov" ? "on" : ""}">Movimentações <span class="num">${C().moves.length}</span></button></div>` +

      C().products.filter((p) => !p.kit).map((p) => { const a = availSimple(p); return `<tr><td class="mono">${p.sku}</td><td>${esc(p.name)}</td><td class="r num">${nf.format(p.phys)}</td><td class="r num">${nf.format(p.res)}</td><td class="r num">${nf.format(p.blk)}</td><td class="r num"><b>${nf.format(a)}</b></td><td class="r num">${nf.format(p.minStock)}</td><td>${a <= 0 ? pill(["Sem saldo", "p-bad"]) : a < p.minStock ? pill(["Abaixo do mínimo", "p-warn"]) : pill(["Ok", "p-good"])}</td></tr>`; })) +
      (canMove ? `<div class="card"><h2>Lançar movimento</h2><div class="form">
        <label class="f" for="m-type">Tipo<select id="m-type"><option>Entrada</option><option>Bloqueio</option></select></label>
        <label class="f" for="m-sku">Produto<select id="m-sku">${C().products.filter((p) => !p.kit).map((p) => `<option>${p.sku}</option>`).join("")}</select></label>
        <label class="f" for="m-qty">Quantidade<input id="m-qty" type="number" min="1" value="100"></label>
        <label class="f span2" for="m-reason">Motivo (obrigatório)<input id="m-reason" placeholder="ex.: recebimento NF 3321 / avaria na conferência"></label>
        <div class="f" style="align-self:end"><button class="btn" data-act="mov">Registrar</button></div></div><div id="err"></div></div>` : `<p class="note">Seu perfil consulta saldos; ajustes são feitos pela equipe de estoque.</p>`)
    : table([{ t: "Data" }, { t: "Tipo" }, { t: "SKU" }, { t: "Qtd", r: 1 }, { t: "Documento" }, { t: "Usuário" }, { t: "Físico / reserv. / bloq. após" }],
      C().moves.map((m) => `<tr><td class="num">${m.when}</td><td>${m.type}</td><td class="mono">${m.sku}</td><td class="r num">${nf.format(m.qty)}</td><td class="mono">${esc(m.doc)}</td><td>${esc(m.user)}</td><td class="num">${m.after}</td></tr>`)));
}

function vExpedicao() {
  const cols = [["APROVADO", "Para separar"], ["SEPARACAO", "Em separação"], ["CONFERENCIA", "Em conferência"], ["PRONTO", "Prontos para expedir"], ["ENVIADO", "Aguardando entrega"]];

    `<div class="grid g3">${cols.map(([s, l]) => { const os = C().orders.filter((o) => o.status === s); return `<div class="card"><h2>${l} · ${os.length}</h2><div class="list">${os.map((o) => `<div class="hbar"><div class="l"><button class="link" data-open="${o.id}">${code(o)}</button><span>${esc(cust(o.customer).name)}</span></div><small class="note">${o.items.length} item(ns) · ${money(o.total)}${s === "PRONTO" && !activeDoc(o) ? " · aguardando NF-e" : ""}</small></div>`).join("") || `<p class="note">Vazio.</p>`}</div></div>`; }).join("")}</div>

}

    <div class="card"><h2>Pendentes de emissão · ${pend.length}</h2>${pend.length ? `<div class="list">${pend.map((o) => `<div class="row" style="justify-content:space-between"><span><button class="link" data-open="${o.id}">${code(o)}</button> · ${esc(cust(o.customer).name)} · ${money(o.total)}</span>${["MEDIATOR","FISCAL"].includes(S.role) ? `<button class="btn" data-nf="${o.id}">Emitir NF-e</button>` : ""}</div>`).join("")}</div>` : `<p class="note">Nenhum pedido aprovado sem nota.</p>`}</div>` +
    table([{ t: "NF-e" }, { t: "Pedido" }, { t: "Chave de acesso" }, { t: "Status" }, { t: "Total", r: 1 }, { t: "Autorizada em" }],

}

function vFinanceiro() {
  const tab = S.tab === "pagar" ? "pagar" : "receber";
  const recv = C().recv; const open = recv.filter((r) => r.paid < r.amount);
  const sumOpen = open.reduce((s, r) => s + r.amount - r.paid, 0);
  const sumLate = open.filter((r) => new Date(r.due) < new Date()).reduce((s, r) => s + r.amount - r.paid, 0);
  const canPay = ["MEDIATOR","FINANCE","MANAGER"].includes(S.role);
  return head("Financeiro", `Faturamento, contas a receber, liquidação e conciliação · ${esc(C().name)}`) +
    `<div class="grid g4"><div class="card kpi"><div class="lbl">A receber</div><div class="val num">${money(sumOpen)}</div></div><div class="card kpi"><div class="lbl">Vencido</div><div class="val num" style="color:var(--bad)">${money(sumLate)}</div></div>
     <div class="card kpi"><div class="lbl">A pagar</div><div class="val num">${money(C().pays.reduce((s, p) => s + p.amount - p.paid, 0))}</div></div><div class="card kpi"><div class="lbl">Inadimplência</div><div class="val num">${sumOpen ? ((sumLate / sumOpen) * 100).toFixed(1) : "0,0"}%</div></div></div>
    <div class="tabs"><button data-tab="receber" class="${tab === "receber" ? "on" : ""}">Contas a receber</button><button data-tab="pagar" class="${tab === "pagar" ? "on" : ""}">Contas a pagar</button></div><div id="err"></div>` +
    (tab === "receber" ? table([{ t: "Pedido" }, { t: "Cliente" }, { t: "Parcela" }, { t: "Vencimento" }, { t: "Valor", r: 1 }, { t: "Pago", r: 1 }, { t: "Status" }, { t: "Baixa" }],
      recv.map((r) => { const o = C().orders.find((x) => x.id === r.order); return `<tr><td><button class="link" data-open="${o.id}">${code(o)}</button></td><td>${esc(cust(r.customer).name)}</td><td>${r.inst}</td><td class="num">${fdate(r.due)}</td><td class="r num">${money(r.amount)}</td><td class="r num">${money(r.paid)}</td><td>${pill(recvStatus(r))}</td><td>${canPay && r.paid < r.amount ? `<div class="row"><input aria-label="Valor da baixa" id="pay-${r.id}" type="number" step="0.01" min="0.01" value="${(r.amount - r.paid).toFixed(2)}" style="width:96px"><button class="btn ghost" data-pay="${r.id}">Baixar</button></div>` : ""}</td></tr>`; }), "Títulos aparecem quando uma NF-e é autorizada.")
    : table([{ t: "Descrição" }, { t: "Categoria" }, { t: "Vencimento" }, { t: "Valor", r: 1 }, { t: "Aprovação" }, { t: "Ação" }],
      C().pays.map((p) => `<tr><td>${esc(p.desc)}</td><td>${p.cat}</td><td class="num">${fdate(p.due)}</td><td class="r num">${money(p.amount)}</td><td>${p.paid >= p.amount ? pill(["Pago", "p-good"]) : p.approved ? pill(["Aprovada", "p-info"]) : pill(["A aprovar", "p-warn"])}</td>
        <td>${p.paid >= p.amount ? "" : !p.approved ? (["MEDIATOR","MANAGER"].includes(S.role) ? `<button class="btn ghost" data-papprove="${p.id}">Aprovar</button>` : `<span class="note">aguarda Diretoria</span>`) : canPay ? `<button class="btn ghost" data-ppay="${p.id}">Pagar</button>` : ""}</td></tr>`)));
}

function vCompras() {
  return head("Compras e importação", "Solicitação, cotação, aprovação, recebimento e rateio de custos") +
    table([{ t: "Nº" }, { t: "Fornecedor" }, { t: "Tipo" }, { t: "Status" }, { t: "Total (R$)", r: 1 }],

function err(e) { const box = $("err"); if (box) box.innerHTML = `<div class="alert bad" style="margin-top:10px">${esc(e.message)}</div>`; else toast(e.message); }
function go(view) { S.view = view; S.orderId = null; S.tab = null; S.composing = false; render(); window.scrollTo(0, 0); }

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button, tr[data-open]"); if (!t) return;
  const ds = t.dataset; const o = S.orderId && C().orders.find((x) => x.id === S.orderId);
  try {
    if (ds.go) return go(ds.go);
    if (ds.tab) { S.tab = ds.tab; return render(); }
    if (ds.open || t.closest("[data-open]")) { const id = ds.open || t.closest("[data-open]").dataset.open; S.view = "pedidos"; S.orderId = id; S.composing = false; render(); return window.scrollTo(0, 0); }
    if (ds.act === "novo") { const c = C(); const custs = role().own ? c.customers.filter((x) => x.seller === role().user) : c.customers; draft = { customer: custs[0]?.id, items: [], freight: 0, discount: 0, inst: 1 }; S.composing = true; return render(); }
    if (ds.act === "descartar") { S.composing = false; draft = null; return render(); }
    if (ds.act === "salvar") { const n = createOrder(draft.customer, role().user === "Aline" ? cust(draft.customer).seller : role().user, draft.items.map((i) => [i.sku, i.qty, i.price, i.disc]), { freight: draft.freight, inst: draft.inst }); S.composing = false; draft = null; S.orderId = n.id; return render(); }
    if (ds.rm !== undefined) { draft.items.splice(+ds.rm, 1); return render(); }
    if (ds.act === "voltar") { S.orderId = null; return render(); }
    if (ds.o === "submit") { submit(o); return render(); }
    if (ds.o === "approve") { approve(o); return render(); }
    if (ds.o === "nf") { emitNF(o); return render(); }
    if (ds.o === "adv") { advance(o, ds.to); return render(); }
    if (ds.o === "cancel") { cancel(o, $("cancel-reason").value); return render(); }
    if (ds.nf) { emitNF(C().orders.find((x) => x.id === ds.nf)); return render(); }
    if (ds.pay) { payRecv(C().recv.find((r) => r.id === ds.pay), Number($(`pay-${ds.pay}`).value)); return render(); }
    if (ds.papprove) { C().pays.find((p) => p.id === ds.papprove).approved = true; toast("Pagamento aprovado pela Diretoria."); return render(); }
    if (ds.ppay) { const p = C().pays.find((x) => x.id === ds.ppay); p.paid = p.amount; toast("Pagamento registrado."); return render(); }
    if (ds.reproc) { const e = C().events.find((x) => x.key === ds.reproc); e.attempts = (e.attempts || 1) + 1; e.msg = `Tentativa ${e.attempts}: anúncio ainda sem vínculo de SKU. Vincule o anúncio e reprocesse.`; toast("Reprocessado: continua com erro até o anúncio ser vinculado."); return render(); }
    if (ds.act === "mov") {
      const qty = Math.floor(Number($("m-qty").value)); const reason = $("m-reason").value.trim();
      if (!(qty > 0)) throw new Error("Quantidade deve ser maior que zero.");
      if (!reason) throw new Error("Informe o motivo do movimento.");
      move($("m-type").value, $("m-sku").value, qty, reason); toast("Movimento registrado e auditado."); return render();
    }
  } catch (e) { err(e); }
});
document.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.id === "company") { S.company = el.value; S.orderId = null; S.composing = false; S.tab = null; toast(`Empresa ${el.value} ativa: telas da empresa anterior foram fechadas.`); return render(); }
  if (el.id === "role") { S.role = el.value; S.orderId = null; S.composing = false; S.tab = null; if (S.role === "CUSTOMER") S.view = "portal"; return render(); }
  if (!draft || el.id === "q-sku") return;
  if (el.id === "q-cust") { draft.customer = el.value; }
  if (el.id === "q-inst") { draft.inst = +el.value; }
  if (el.id === "q-freight") { draft.freight = Math.max(0, Number(el.value) || 0); }
  if (el.dataset.qi !== undefined) { const i = draft.items[+el.dataset.qi]; const v = Number(el.value); i[el.dataset.k] = el.dataset.k === "qty" ? Math.max(1, Math.floor(v) || 1) : Math.max(0, v || 0); }
  // "change" dispara no blur, às vezes no meio de um clique: redesenha depois.
  setTimeout(render, 0);
});
document.addEventListener("keydown", (ev) => {
  if (ev.target.id !== "q-sku" || ev.key !== "Enter") return;
  ev.preventDefault();
  const [sku, q] = ev.target.value.trim().toUpperCase().split("*");
  const p = prod(sku);
  if (!p) { toast(`SKU ${sku || "(vazio)"} não existe nesta empresa.`); return; }
  const qty = Math.max(1, parseInt(q || "1", 10) || 1);
  const ex = draft.items.find((i) => i.sku === sku);
  if (ex) ex.qty += qty; else draft.items.push({ sku, qty, price: p.price, disc: 0 });
  render(); const inp = $("q-sku"); if (inp) inp.focus();
});
$("burger").addEventListener("click", () => $("side").classList.toggle("open"));

S = seed();
render();
</script>

</html>

<title>MAX LED ERP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app SaaS — menu lateral com ícones, barra superior com busca e
   contexto, conteúdo em cards arredondados sobre fundo neutro frio.
   Tokens primeiro; o tema escuro só redefine tokens. */
:root {
  --bg: #f4f5f9;
  --surface: #ffffff;
  --surface-2: #f7f8fb;
  --border: #e6e8f0;
  --text: #171a26;
  --text-2: #636a80;
  --text-3: #8f95a8;
  --side: #12141c;
  --side-2: #1c1f2b;
  --side-text: #c3c7d6;
  --brand: #e0a526;        /* dourado MAX LED, usado como cor de marca */
  --brand-ink: #1a1405;
  --brand-soft: #fdf3dc;
  --c1: #5b5bf0;           /* gráficos: índigo */
  --c2: #12b0a0;           /* teal */
  --c3: #e0a526;           /* dourado */
  --c4: #e8577a;           /* rosa */
  --good: #12a150; --good-soft: #e3f6eb;
  --info: #3b6ef5; --info-soft: #e7eefe;
  --warn: #d9780f; --warn-soft: #fdf0e1;
  --bad: #dc3545;  --bad-soft: #fde8ea;
  --neutral-soft: #eef0f5;
  --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 4px 16px rgba(20, 24, 40, .05);
  --display: "Plus Jakarta Sans", "Segoe UI", -apple-system, Roboto, sans-serif;
  --body: "Plus Jakarta Sans", "Segoe UI", -apple-system, Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1016; --surface: #171a23; --surface-2: #1d2130; --border: #2a2f40;
    --text: #eceef5; --text-2: #a2a8bc; --text-3: #737a90;
    --side: #0a0b10; --side-2: #171a23; --side-text: #b7bccc;
    --brand-soft: #3a2d10; --c1: #8282ff; --c2: #2cc9b8; --c4: #f17595;
    --good: #38c674; --good-soft: #143224; --info: #6e95ff; --info-soft: #18254a;
    --warn: #f0a04b; --warn-soft: #3a2812; --bad: #f2646f; --bad-soft: #3d1a1f; --neutral-soft: #232838;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1016; --surface: #171a23; --surface-2: #1d2130; --border: #2a2f40;
  --text: #eceef5; --text-2: #a2a8bc; --text-3: #737a90;
  --side: #0a0b10; --side-2: #171a23; --side-text: #b7bccc;
  --brand-soft: #3a2d10; --c1: #8282ff; --c2: #2cc9b8; --c4: #f17595;
  --good: #38c674; --good-soft: #143224; --info: #6e95ff; --info-soft: #18254a;
  --warn: #f0a04b; --warn-soft: #3a2812; --bad: #f2646f; --bad-soft: #3d1a1f; --neutral-soft: #232838;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: .86em; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.app { display: flex; min-height: 100%; }
.side {
  width: 248px; flex: none; background: var(--side); color: var(--side-text);
  padding: 20px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.brand b { font-weight: 800; font-size: 16px; color: #fff; letter-spacing: -.01em; }
.brand small { display: block; font-size: 11px; color: var(--side-text); font-weight: 500; }
.ctx { display: grid; gap: 10px; background: var(--side-2); border-radius: 14px; padding: 12px; }
.ctx label { display: grid; gap: 5px; font-size: 11px; font-weight: 600; color: var(--side-text); }
.ctx select { width: 100%; min-width: 0; background: var(--side); color: #fff; border: 1px solid #2b2f3e; border-radius: 10px; padding: 8px 9px; font-size: 13px; }
.nav-sec { font-size: 11px; font-weight: 700; color: #6c7186; padding: 0 10px 6px; letter-spacing: .04em; }
.nav { display: grid; gap: 2px; }
.nav button {
  text-align: left; border: 0; background: transparent; color: var(--side-text); padding: 9px 10px; border-radius: 10px;
  cursor: pointer; display: flex; align-items: center; gap: 11px; font-size: 13.5px; font-weight: 500;
}
.nav button:hover { background: var(--side-2); color: #fff; }
.nav button.on { background: var(--brand); color: var(--brand-ink); font-weight: 700; }
.nav button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.nav .count { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--bad); color: #fff; border-radius: 99px; padding: 1px 7px; }
.nav button.on .count { background: var(--brand-ink); color: var(--brand); }
.side-foot { margin-top: auto; font-size: 11.5px; line-height: 1.5; padding: 12px; border-radius: 12px; background: var(--side-2); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.burger { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: 38px; height: 38px; cursor: pointer; place-items: center; }
.search { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; color: var(--text-3); font-size: 13px; }
.demo-tag { font-size: 12px; font-weight: 600; color: var(--warn); background: var(--warn-soft); border-radius: 99px; padding: 5px 11px; white-space: nowrap; }
.who { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-2); }
.who b { color: var(--text); font-weight: 700; display: block; font-size: 13px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; flex: none; }

.view { flex: 1; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }

.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.head h1 { font-weight: 800; font-size: 26px; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.head p { margin: 4px 0 0; color: var(--text-2); font-size: 13.5px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 20px; min-width: 0; box-shadow: var(--shadow); }
.card h2 { font-size: 15px; font-weight: 700; margin: 0 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h2 small { font-size: 12px; font-weight: 500; color: var(--text-3); }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }

.kpi { display: grid; gap: 12px; }
.kpi .top-row { display: flex; align-items: center; justify-content: space-between; }
.chip { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; }
.chip.c1 { background: color-mix(in srgb, var(--c1) 14%, transparent); color: var(--c1); }
.chip.c2 { background: color-mix(in srgb, var(--c2) 14%, transparent); color: var(--c2); }
.chip.c3 { background: color-mix(in srgb, var(--c3) 18%, transparent); color: var(--c3); }
.chip.c4 { background: color-mix(in srgb, var(--c4) 14%, transparent); color: var(--c4); }
.kpi .lbl { font-size: 13px; color: var(--text-2); font-weight: 500; }
.kpi .val { font-weight: 800; font-size: 26px; letter-spacing: -.02em; }
.delta { font-size: 12px; font-weight: 700; border-radius: 99px; padding: 3px 8px; }
.delta.up { color: var(--good); background: var(--good-soft); }
.delta.down { color: var(--bad); background: var(--bad-soft); }

.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid transparent; background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: 13px; border-radius: 11px; padding: 9px 15px; cursor: pointer; }
.btn:hover { filter: brightness(1.05); }
.btn svg.i { width: 16px; height: 16px; }
.btn.ghost { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn.ghost:hover { border-color: var(--text-3); filter: none; }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .link:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; min-width: 620px; color: inherit; font-size: inherit; }
th { text-align: left; font-size: 12px; color: var(--text-3); font-weight: 600; padding: 13px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 13px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.link { color: var(--c1); font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--mono); font-size: .9em; }
.who-cell { display: flex; align-items: center; gap: 10px; }
.who-cell .avatar { width: 30px; height: 30px; font-size: 11px; }
.who-cell small { display: block; color: var(--text-3); font-size: 12px; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 4px 10px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-good { color: var(--good); background: var(--good-soft); }
.p-info { color: var(--info); background: var(--info-soft); }
.p-warn { color: var(--warn); background: var(--warn-soft); }
.p-bad { color: var(--bad); background: var(--bad-soft); }
.p-neutral { color: var(--text-2); background: var(--neutral-soft); }

.tabs { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 4px; justify-self: start; max-width: 100%; }
.tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 10px; cursor: pointer; color: var(--text-2); font-weight: 600; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.tabs button span { font-size: 11px; background: var(--neutral-soft); border-radius: 99px; padding: 1px 7px; }
.tabs button.on { background: var(--text); color: var(--surface); }
.tabs button.on span { background: color-mix(in srgb, var(--surface) 20%, transparent); }

.form { display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.f { display: grid; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--text-2); min-width: 0; }
.f input, .f select, .f textarea, td input { border: 1px solid var(--border); background: var(--surface-2); border-radius: 10px; padding: 9px 11px; color: var(--text); width: 100%; min-width: 0; font-weight: 500; }
.span2 { grid-column: span 2; } .span3 { grid-column: 1 / -1; }

.note { font-size: 13px; color: var(--text-2); line-height: 1.55; }
.alert { border-radius: 12px; padding: 11px 14px; font-size: 13px; font-weight: 500; display: flex; gap: 8px; align-items: flex-start; }
.alert.bad { color: var(--bad); background: var(--bad-soft); }
.alert.good { color: var(--good); background: var(--good-soft); }
.alert.warn { color: var(--warn); background: var(--warn-soft); }

.steps { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.step { display: grid; gap: 8px; justify-items: center; text-align: center; font-size: 11.5px; color: var(--text-3); font-weight: 600; }
.step i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--neutral-soft); color: var(--text-3); font-style: normal; font-size: 12px; }
.step.done { color: var(--text-2); } .step.done i { background: var(--good); color: #fff; }
.step.now { color: var(--text); } .step.now i { background: var(--brand); color: var(--brand-ink); box-shadow: 0 0 0 4px var(--brand-soft); }

.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--text-3); font-size: 11px; font-family: var(--body); }
.chart .grid-l { stroke: var(--border); stroke-dasharray: 3 4; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.donut-wrap { display: grid; grid-template-columns: 140px 1fr; gap: 18px; align-items: center; }
.hbar { display: grid; gap: 6px; }
.hbar .l { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; align-items: center; }
.hbar .t { height: 8px; background: var(--neutral-soft); border-radius: 99px; overflow: hidden; }
.hbar .t i { display: block; height: 100%; border-radius: 99px; }
.list { display: grid; gap: 14px; }
.pend { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; background: var(--surface-2); }
.pend .chip { width: 34px; height: 34px; border-radius: 10px; }
.pend b { margin-left: auto; font-size: 16px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 13px; margin: 0; }
.kv dt { color: var(--text-3); } .kv dd { margin: 0; font-weight: 500; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; font-size: 13px; }
.timeline li { display: grid; grid-template-columns: 12px 1fr; gap: 12px; }
.timeline li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c1); margin-top: 4px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c1) 15%, transparent); }
.timeline small { color: var(--text-3); display: block; margin-top: -10px; grid-column: 2; }

.kanban { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 4px; }
.lane { background: var(--surface-2); border: 1px solid var(--border); border-radius: 16px; padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.lane h3 { margin: 0; font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.ticket { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: grid; gap: 6px; font-size: 12.5px; box-shadow: var(--shadow); cursor: pointer; text-align: left; }
.ticket:hover { border-color: var(--c1); }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--text); color: var(--surface); border-radius: 12px; padding: 12px 16px; font-size: 13px; font-weight: 600; z-index: 30; max-width: 360px; box-shadow: var(--shadow); }

.portal-top { background: linear-gradient(120deg, var(--side), #262a3a); color: #fff; border-radius: 18px; padding: 22px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.portal-top b { font-size: 18px; }

@media (max-width: 1080px) {
  .g4, .g5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g21, .g3 { grid-template-columns: minmax(0, 1fr); }
  .form { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .side { position: fixed; z-index: 20; left: 0; top: 0; transform: translateX(-100%); transition: transform .2s; }
  .side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.5); }
  .burger { display: grid; }
  .search, .who-name { display: none; }
  .form { grid-template-columns: 1fr; }
  .span2 { grid-column: auto; }
  .steps { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 14px; }
  .donut-wrap { grid-template-columns: 1fr; justify-items: center; }
}
@media (max-width: 460px) { .g4, .g2, .g5 { grid-template-columns: minmax(0, 1fr); } .demo-tag { display: none; } }
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

/* ===== Ideia 4: vidro e degradê =====
   Visual único e escuro por escolha: fundo grafite com brilhos âmbar e
   roxo, cards de vidro fosco, destaques no degradê dourado→laranja. */
:root, :root[data-theme="light"], :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0e0c;
  --surface: rgba(255, 255, 255, .055);
  --surface-2: rgba(255, 255, 255, .08);
  --border: rgba(255, 255, 255, .11);
  --text: #f6f1e7;
  --text-2: #bdb4a4;
  --text-3: #8a8274;
  --side: rgba(14, 13, 19, .55);
  --side-2: rgba(255, 255, 255, .06);
  --side-text: #c9c0b0;
  --brand: #f2cc5b;
  --brand-ink: #1b1206;
  --brand-soft: rgba(255, 198, 92, .14);
  --grad: linear-gradient(135deg, #fff1b8 0%, #f2cc5b 22%, #c9952a 52%, #f0cf6a 78%, #a87a1c 100%);
  --grad-soft: linear-gradient(135deg, rgba(242,204,91,.22), rgba(168,122,28,.12));
  --c1: #f2cc5b; --c2: #c9952a; --c3: #8c7a55; --c4: #fff1b8;
  --good: #7be8b0; --good-soft: rgba(123, 232, 176, .13);
  --info: #9db8ff; --info-soft: rgba(157, 184, 255, .13);
  --warn: #ffc65c; --warn-soft: rgba(255, 198, 92, .13);
  --bad: #ff8585; --bad-soft: rgba(255, 133, 133, .13);
  --neutral-soft: rgba(255, 255, 255, .08);
  --shadow: 0 10px 30px rgba(0, 0, 0, .25);
  --display: "Sora", "Segoe UI", sans-serif;
  --body: "Sora", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f0e0c; --surface: rgba(255,255,255,.055); --surface-2: rgba(255,255,255,.08); --border: rgba(255,255,255,.11); --text: #f6f1e7; --text-2: #bdb4a4; --text-3: #8a8274; --side: rgba(14,13,19,.55); --side-2: rgba(255,255,255,.06); --side-text: #c9c0b0; --brand-soft: rgba(255,198,92,.14); --c1: #f2cc5b; --c2: #c9952a; --c3: #8c7a55; --c4: #fff1b8; --good: #7be8b0; --good-soft: rgba(123,232,176,.13); --info: #9db8ff; --info-soft: rgba(157,184,255,.13); --warn: #ffc65c; --warn-soft: rgba(255,198,92,.13); --bad: #ff8585; --bad-soft: rgba(255,133,133,.13); --neutral-soft: rgba(255,255,255,.08); --shadow: 0 10px 30px rgba(0,0,0,.25); } }
body {
  background:
    radial-gradient(900px 600px at 8% -5%, rgba(201, 149, 42, .42), transparent 60%),
    radial-gradient(800px 700px at 100% 105%, rgba(168, 122, 28, .30), transparent 60%),
    radial-gradient(500px 380px at 72% 18%, rgba(242, 204, 91, .10), transparent 70%),
    #0f0e0c;
  background-attachment: fixed;
  font-weight: 400;
}
.side { background: var(--side); backdrop-filter: blur(18px); border-right: 1px solid var(--border); }
.brand-mark { background: var(--grad); color: var(--brand-ink); border-radius: 12px; }
.brand b { background: none; color: #fff; }
.ctx { background: var(--side-2); border: 1px solid var(--border); }
.ctx select { background: rgba(0,0,0,.25); border-color: var(--border); }
.nav button.on { background: var(--grad); color: #1b1206; font-weight: 700; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 4px 14px rgba(201,149,42,.3); }

.f input, .f select, .f textarea, td input { background: rgba(0,0,0,.25); border-color: var(--border); }

.avatar { box-shadow: 0 0 0 2px rgba(255,255,255,.12); }

/* Botões: estilo provisório (degradê) — a ser definido pelo cliente */
/* Botão principal: dourado metálico com brilho no topo e borda clara. */
.btn {
  background: var(--grad); background-size: 160% 160%; background-position: 0% 50%;
  color: #1b1206; border: 1px solid rgba(255, 241, 184, .55); border-radius: 12px; font-weight: 700;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 -2px 0 rgba(120, 82, 10, .35), 0 6px 18px rgba(201, 149, 42, .30);
  text-shadow: 0 1px 0 rgba(255, 241, 184, .45); transition: background-position .35s, box-shadow .2s;
}
.btn:hover { filter: none; background-position: 100% 50%; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -2px 0 rgba(120,82,10,.35), 0 8px 24px rgba(201,149,42,.42); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: rgba(255,255,255,.04); color: #f2cc5b; border: 1px solid rgba(242,204,91,.45); box-shadow: none; text-shadow: none; }
.btn.ghost:hover { background: var(--grad-soft); border-color: #f2cc5b; }
.btn.danger { background: var(--bad-soft); color: var(--bad); border: 1px solid rgba(255,133,133,.35); box-shadow: none; text-shadow: none; }

/* ===== Layout D: barra de comandos no topo + dock inferior ===== */
.cbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15;
  background: rgba(15, 14, 12, .55); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.cbar-in { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 16px; padding-block: 12px; }
.cmd { position: relative; flex: 1; max-width: 560px; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 0 12px; color: var(--text-3); }
.cmd:focus-within { border-color: rgba(242, 204, 91, .6); box-shadow: 0 0 0 4px rgba(242, 204, 91, .12); }
.cmd input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--text); padding: 11px 0; font-size: 14px; }
.cmd input::placeholder { color: var(--text-3); }
.cmd kbd { font-family: inherit; font-size: 11px; border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
.cmd-res { position: absolute; left: 0; right: 0; top: calc(100% + 8px); background: rgba(24, 22, 18, .96); border: 1px solid var(--border); border-radius: 14px; padding: 6px; box-shadow: 0 18px 40px rgba(0,0,0,.45); max-height: 60vh; overflow-y: auto; }
.cmd-res button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: none; border: 0; padding: 9px 10px; border-radius: 10px; color: var(--text); cursor: pointer; font-size: 13.5px; }
.cmd-res button small { margin-left: auto; color: var(--text-3); font-size: 11.5px; }
.cmd-res button.sel, .cmd-res button:hover { background: rgba(242, 204, 91, .12); }
.cmd-res .grp { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); padding: 8px 10px 4px; }
.cmd-res .empty { padding: 12px; color: var(--text-3); font-size: 13px; }
.cbar .ctx { display: flex; gap: 10px; margin-left: auto; background: none; border: 0; padding: 0; }
.cbar .ctx label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.cbar .ctx select { width: auto; max-width: 200px; border-radius: 10px; }
.view { padding-block: 26px 120px; }
.wrap { max-width: 1280px; }

.dock {
  position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 6px; padding: 8px; max-width: calc(100vw - 24px); overflow-x: auto; scrollbar-width: none;
  background: rgba(22, 20, 16, .72); border: 1px solid var(--border); border-radius: 20px;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 18px 40px rgba(0,0,0,.45);
}
.dock button {
  position: relative; flex: none; width: 50px; height: 50px; border-radius: 14px; border: 1px solid var(--border);
  background: rgba(255,255,255,.05); color: var(--text-2); display: grid; place-items: center; cursor: pointer;
  transition: transform .15s, background .15s;
}
.dock button svg.i { width: 22px; height: 22px; }
.dock button:hover { transform: translateY(-4px); color: var(--text); background: rgba(255,255,255,.09); }
.dock button.on { background: var(--grad); color: #1b1206; border: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 6px 18px rgba(201,149,42,.35); }
.dock button .tip {
  position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); white-space: nowrap;
  background: rgba(24,22,18,.95); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px;
  font-size: 12px; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity .12s;
}
.dock button:hover .tip, .dock button:focus-visible .tip { opacity: 1; }
.dock button.on::after { content: ""; position: absolute; bottom: -6px; width: 5px; height: 5px; border-radius: 50%; background: #f2cc5b; }
.dock .count { position: absolute; top: -5px; right: -5px; font-size: 10px; font-weight: 700; background: var(--bad); color: #fff; border-radius: 99px; padding: 1px 6px; }
.dock .sep { width: 1px; background: var(--border); margin: 6px 2px; flex: none; }
.toast { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 1100px) { .cbar .ctx label span, .cbar .who-name { display: none; } }
@media (max-width: 820px) {
  .cbar-in { flex-wrap: wrap; gap: 10px; }
  .cmd { order: 3; flex-basis: 100%; max-width: none; }
  .cmd kbd { display: none; }
  .cbar .ctx { margin-left: auto; }
  .cbar .ctx select { max-width: 120px; font-size: 12px; padding: 6px; }
  .cbar .ctx label { font-size: 0; }
  .dock { left: 12px; right: 12px; transform: none; justify-content: flex-start; }
  .dock button { width: 46px; height: 46px; }
  .dock button .tip { display: none; }
}
@media (max-width: 420px) { .brand small { display: none; } }
@media (prefers-reduced-motion: reduce) { .dock button { transition: none; } }

td select { border: 1px solid var(--border); background: rgba(0,0,0,.25); color: var(--text); border-radius: 10px; padding: 8px 9px; max-width: 100%; }
/* DANFE: papel claro dentro do tema escuro, como o documento impresso. */
.danfe { position: relative; background: #fbfaf6; color: #1a1a1a; border-radius: 14px; padding: 18px; display: grid; gap: 10px; font-size: 12.5px; overflow: hidden; }
.danfe small { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #6b675e; margin-bottom: 2px; }
.dz-wm { position: absolute; inset: 40% -10% auto; text-align: center; font-size: 46px; font-weight: 800; color: rgba(179, 50, 47, .12); transform: rotate(-12deg); pointer-events: none; }
.dz-head { display: grid; grid-template-columns: 1.2fr .8fr 1.4fr; gap: 10px; }
.dz-head > div, .dz-row > div { border: 1px solid #cfcabd; border-radius: 6px; padding: 8px 10px; min-width: 0; }

@media (max-width: 760px) { .dz-head, .dz-row { grid-template-columns: 1fr; } .danfe { overflow-x: auto; } }

/* ===== Layout clássico (como o IUVEN): menus suspensos + atalhos ===== */
.cbar.classic { position: sticky; }
.cbar.classic .cbar-in { padding-block: 10px 8px; }
.brand small#titleline { max-width: 340px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menubar-wrap, .toolbar-wrap { max-width: 1280px; margin: 0 auto; }
.menubar { display: flex; flex-wrap: wrap; gap: 2px; border-top: 1px solid var(--border); padding-top: 4px; }
.mb { position: relative; }
.mb > button { white-space: nowrap; background: none; border: 0; color: var(--text-2); padding: 7px 11px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }

.mb .dd button:hover, .mb .dd button:focus-visible { background: var(--grad); color: #1b1206; outline: none; }

.toolbar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 8px 10px; }
.toolbar button { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 12px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; }

.toolbar button.on { background: var(--grad); color: #1b1206; border-color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
.toolbar button.on svg.i { color: #1b1206; }
.view { padding-block: 22px 120px; }

/* Lançamento de pedido no formato do IUVEN */

@media (max-width: 1500px) { .cbar .who-name { display: none; } }

@media (max-width: 1100px) { .pf-head { grid-template-columns: repeat(4, minmax(0, 1fr)); } .pf-head .wide { grid-column: span 4; } }

  .mb .dd { position: fixed; left: 12px; right: 12px; top: auto; min-width: 0; }
  .pf-head { grid-template-columns: repeat(2, minmax(0, 1fr)); } .pf-head .wide { grid-column: span 2; }

}

.sug[hidden] { display: none; }
.sug button { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; background: none; border: 0; color: var(--text); padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
.sug button small { color: var(--text-3); font-size: 11.5px; white-space: nowrap; }
.sug button.sel, .sug button:hover { background: rgba(242, 204, 91, .14); }
.keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-3); }
kbd { font-family: inherit; font-size: 11px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; margin-right: 3px; color: var(--text-2); }
.btn kbd { border-color: rgba(27, 18, 6, .3); color: inherit; margin: 0 0 0 4px; }
.repeat .btn { padding: 6px 10px; font-size: 12px; }
.ticket { cursor: default; }
.ticket .btn { justify-self: start; padding: 6px 10px; font-size: 12px; }

function explode(item) {
  const p = prod(item.sku);

function move(type, sku, qty, doc, key) {

function bulk(kind) {
  const os = [...PF.sel].map((id) => C().orders.find((o) => o.id === id)).filter(Boolean); let ok = 0; const fails = [];
  os.forEach((o) => { try {
    if (kind === "approve") { if (o.status === "COTACAO") submit(o, true); if (o.status === "AGUARDANDO") approve(o); else if (o.status !== "APROVADO") throw new Error("não está aguardando aprovação"); }
    if (kind === "nf") { if (activeDoc(o)) throw new Error("já tem NF-e"); const d = nfDefaults(o); const e = nfErrors(d); if (e.length || !billed(o) || o.status === "CANCELADO") throw new Error(e[0] || "pedido não aprovado"); emitNF(o, true); activeDoc(o).fiscal = d; }
    if (kind === "sep") { if (o.status !== "APROVADO") throw new Error("não está aprovado"); advance(o, "SEPARACAO", true); }
    ok++; } catch (e) { fails.push(`${code(o)}: ${e.message}`); } });
  PF.sel.clear(); toast(`${ok} pedido(s) atualizado(s)${fails.length ? ` · ${fails.length} não: ${fails.slice(0, 2).join("; ")}` : ""}.`); render();
}

// Central de notificações (sino no topo).
function alertsList() {
  const c = C(); const out = [];
  const ap = visibleOrders().filter((o) => o.status === "AGUARDANDO"); if (ap.length && can("pedidos")) out.push(["clock", `${ap.length} pedido(s) aguardando aprovação`, "pedidos", "aprovacao"]);
  const nf0 = c.orders.filter((o) => billed(o) && o.status !== "CANCELADO" && !activeDoc(o)); if (nf0.length && can("fiscal")) out.push(["fiscal", `${nf0.length} pedido(s) aprovado(s) sem NF-e`, "fiscal"]);
  const low = c.products.filter((p) => !p.kit && availSimple(p) < p.minStock); if (low.length && can("estoque")) out.push(["alert", `${low.length} produto(s) abaixo do estoque mínimo`, "estoque"]);
  const ov = c.recv.filter((r) => r.paid < r.amount && new Date(r.due) < new Date()); if (ov.length && can("financeiro")) out.push(["financeiro", `${ov.length} título(s) vencido(s) · ${money(ov.reduce((s, r) => s + r.amount - r.paid, 0))}`, "financeiro"]);

}

  return C().products.filter((p) => matchWords(`${p.sku} ${p.name}`, t)).slice(0, 8)
    .map((p) => ({ key: p.sku, html: `${thumb(p, 30)}<b class="mono">${p.sku}</b><span>${esc(p.name)}</span><small>${money(p.price)} · disp. ${nf.format(avail(p))}</small>` }));
}
function sugCustomers(q) {

  return list.filter((c) => matchWords(`${c.id} ${c.name} ${c.city || ""}`, q) || (t && c.doc.replace(/\D/g, "").includes(t))).slice(0, 8)

function advanceMany(ids) {
  let ok = 0; const fails = [];
  ids.forEach((id) => { const o = C().orders.find((x) => x.id === id); const nx = NEXT_STEP[o.status]; if (!nx) return; try { advance(o, nx[0], true); ok++; } catch (e) { fails.push(`${code(o)}: ${e.message}`); } });
  toast(`${ok} pedido(s) avançado(s)${fails.length ? `; ${fails.length} com pendência` : ""}.`);
  S.batchErrors = fails.length ? fails : null; render();
}

function vPedido() {
  const o = C().orders.find((x) => x.id === S.orderId);
  if (!o || (role().own && o.seller !== role().user)) { S.orderId = null; return `<div class="alert bad">Pedido não encontrado nesta empresa.</div>`; }
  const d = activeDoc(o); const st = o.status; const isApprover = role().approve || S.role === "MEDIATOR";
  const fiscalOk = ["MEDIATOR","FISCAL"].includes(S.role); const stockOk = ["MEDIATOR","STOCK"].includes(S.role);
  const sellerOk = ["MEDIATOR","MANAGER","SALES_MANAGER","SELLER"].includes(S.role);
  const acts = [];
  if (st === "COTACAO" && sellerOk) acts.push(`<button class="btn" data-o="submit">Enviar pedido</button>`);
  if (st === "AGUARDANDO" && isApprover) acts.push(`<button class="btn" data-o="approve">Aprovar</button>`);
  if (FLOW.indexOf(st) >= 2 && st !== "CANCELADO" && !d && fiscalOk) acts.push(`<button class="btn" data-o="nf">Emitir NF-e</button>`);
  const next = { APROVADO: ["SEPARACAO", "Iniciar separação"], SEPARACAO: ["CONFERENCIA", "Concluir separação"], CONFERENCIA: ["PRONTO", "Conferir e embalar"], PRONTO: ["ENVIADO", "Despachar"], ENVIADO: ["ENTREGUE", "Confirmar entrega"] }[st];
  if (next && stockOk) acts.push(`<button class="btn ghost" data-o="adv" data-to="${next[0]}">${next[1]}</button>`);
  const canCancel = sellerOk && FLOW.indexOf(st) < FLOW.indexOf("ENVIADO") && st !== "CANCELADO";
  const recv = C().recv.filter((r) => r.order === o.id);
  const stepIdx = FLOW.indexOf(st);
  return `<div class="row"><button class="btn ghost" data-act="voltar">Voltar aos pedidos</button></div>` +
    head(`Pedido ${code(o)}`, `${esc(cust(o.customer).name)} · vendedor ${esc(o.seller)} · ${esc(o.channel)}`, pill(STATUS[st])) +
    (st !== "CANCELADO" ? `<div class="card"><div class="steps">${["Cotação","Aprovação","Aprovado","Separação","Conferência","Pronto","Enviado","Entregue"].map((l, i) => `<div class="step ${i < stepIdx ? "done" : i === stepIdx ? "now" : ""}"><i>${i < stepIdx ? "&#10003;" : i + 1}</i>${l}</div>`).join("")}</div></div>` : "") +
    `<div class="card"><div class="row" style="justify-content:space-between"><div class="row">${acts.join("") || `<span class="note">Nenhuma ação disponível para o perfil ${esc(role().label)} nesta etapa.</span>`}</div>
      ${canCancel ? `<div class="row"><label class="f" for="cancel-reason" style="min-width:200px">Motivo do cancelamento<input id="cancel-reason" placeholder="obrigatório"></label><button class="btn danger" data-o="cancel" style="align-self:flex-end">Cancelar pedido</button></div>` : ""}</div>
      <div id="err"></div>
      ${st === "AGUARDANDO" ? `<div class="alert warn" style="margin-top:10px">Motivo da aprovação: ${esc((o.reasons || []).join("; "))}.</div>` : ""}
      ${o.approvedAt ? `<p class="note" style="margin:10px 0 0">Aprovação: <b>${esc(o.approvedBy)}</b> em ${o.approvedAt}.</p>` : ""}
    </div>
    <div class="grid g21">
      <div>${table([{ t: "SKU" }, { t: "Produto" }, { t: "Qtd", r: 1 }, { t: "Preço", r: 1 }, { t: "Desc.", r: 1 }, { t: "Subtotal", r: 1 }].concat(seeCosts() ? [{ t: "Margem", r: 1 }] : []),
        o.items.map((i) => { const p = prod(i.sku); const cost = p.kit ? p.kit.reduce((s, [k, q]) => s + q * prod(k).cost, 0) : p.cost; return `<tr><td class="mono">${i.sku}</td><td>${esc(p.name)}${p.kit ? `<br><small class="note">baixa ${p.kit.map(([k, q]) => `${q * i.qty} × ${k}`).join(", ")}</small>` : ""}</td><td class="r num">${nf.format(i.qty)}</td><td class="r num">${money(i.price)}</td><td class="r num">${i.disc}%</td><td class="r num">${money(i.sub)}</td>${seeCosts() ? `<td class="r num">${(((i.sub - cost * i.qty) / i.sub) * 100).toFixed(0)}%</td>` : ""}</tr>`; }))}
        <p class="note" style="text-align:right">Itens ${money(o.itemsTotal)} · frete ${money(o.freight)} · <b style="color:var(--text)">total ${money(o.total)}</b> em ${o.inst}x</p></div>
      <div class="grid">

        <div class="card"><h2>Contas a receber</h2>${recv.length ? `<div class="list">${recv.map((r) => `<div class="hbar"><div class="l"><span>${r.inst} · vence ${fdate(r.due)}</span><span class="num">${money(r.amount)} ${pill(recvStatus(r))}</span></div></div>`).join("")}</div>` : `<p class="note">Geradas quando a NF-e é autorizada.</p>`}</div>
        ${o.tracking ? `<div class="card"><h2>Expedição</h2><dl class="kv"><dt>Transportadora</dt><dd>${esc(o.carrier)}</dd><dt>Rastreio</dt><dd class="mono">${esc(o.tracking)}</dd></dl></div>` : ""}
      </div>
    </div>
    <div class="card"><h2>Histórico do pedido</h2><ol class="timeline">${o.events.map((e) => `<li>${esc(e.msg)}<small>${e.when} · ${esc(e.who)}</small></li>`).join("")}</ol></div>`;
}

function vFiscal() {
  if (nfDraft) return vNfForm();
  if (S.danfe) return vDanfe();
  const pend = C().orders.filter((o) => FLOW.indexOf(o.status) >= 2 && o.status !== "CANCELADO" && !activeDoc(o));
  return head("Fiscal", "Ambiente de homologação · provedor: simulador (sem valor fiscal)") +
    `<div class="alert warn">${icon("alert")}<span>O provedor fiscal real e o certificado digital ainda precisam ser configurados. Até lá, as notas são emitidas só em homologação.</span></div>
    ${S.batchErrors && S.view === "fiscal" ? `<div class="alert warn">${icon("alert")}<span>Notas que precisam de ajuste antes de emitir:<br>${S.batchErrors.map(esc).join("<br>")}</span></div>` : ""}<div class="card"><h2>Pendentes de emissão · ${pend.length} ${pend.length >= 1 && ["MEDIATOR","FISCAL"].includes(S.role) ? `<button class="btn" data-act="nf-all">${icon("fiscal")}Emitir todas (${pend.length})</button>` : ""}</h2>${pend.length ? `<div class="list">${pend.map((o) => `<div class="row" style="justify-content:space-between"><span><button class="link" data-open="${o.id}">${code(o)}</button> · ${esc(cust(o.customer).name)} · ${money(o.total)}</span>${["MEDIATOR","FISCAL"].includes(S.role) ? `<button class="btn" data-nf="${o.id}">${icon("fiscal")}Preencher e emitir NF-e</button>` : ""}</div>`).join("")}</div>` : `<p class="note">Nenhum pedido aprovado sem nota.</p>`}</div>` +
    `<p class="note" style="margin:0">Clique no número da nota para ver o DANFE e o XML.</p>` + table([{ t: "NF-e" }, { t: "Pedido" }, { t: "Chave de acesso" }, { t: "Status" }, { t: "Total", r: 1 }, { t: "Autorizada em" }],
      C().docs.map((d) => { const o = C().orders.find((x) => x.id === d.order); return `<tr><td class="num"><button class="link" data-danfe="${d.id}">NF-e ${d.n}</button></td><td><button class="link" data-open="${o.id}">${code(o)}</button></td><td class="mono">${d.key}</td><td>${pill(["Autorizada", "p-good"])}</td><td class="r num">${money(d.total)}</td><td class="num">${d.when}</td></tr>`; }), "Nenhuma nota emitida.");

const CST_OPTS = [
  ["102", "CSOSN 102 · Simples Nacional sem crédito"],
  ["101", "CSOSN 101 · Simples Nacional com crédito"],
  ["000", "CST 00 · Tributada integralmente"],
  ["020", "CST 20 · Com redução de base"],
  ["060", "CST 60 · ICMS cobrado por substituição"],
];
const EMIT_UF = "SP";
let nfDraft = null;
function ufOf(c) { const m = (c.city || "").match(/\/([A-Z]{2})$/); return m ? m[1] : ""; }
function openNfForm(o) {
  if (!["MEDIATOR", "FISCAL"].includes(S.role)) throw new Error("Seu perfil não emite NF-e.");
  if (FLOW.indexOf(o.status) < 2 || o.status === "CANCELADO") throw new Error("A nota só pode ser emitida para pedido aprovado.");
  if (activeDoc(o)) throw new Error("Este pedido já tem NF-e autorizada.");
  nfDraft = nfDefaults(o);
  S.view = "fiscal"; S.orderId = null; S.danfe = null; render(); window.scrollTo(0, 0);
}
function nfErrors(d) {
  const e = []; const o = C().orders.find((x) => x.id === d.order); const c = cust(o.customer);
  if (!/^\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}$|^\d{14}$|^\d{11}$/.test(c.doc)) e.push("CNPJ/CPF do destinatário inválido.");
  if (!d.natureza.trim()) e.push("Informe a natureza da operação.");
  d.items.forEach((i) => {
    if (!/^\d{8}$/.test(i.ncm.replace(/\D/g, ""))) e.push(`NCM de ${i.sku} precisa ter 8 dígitos.`);
    if (!/^[1-7]\d{3}$/.test(i.cfop)) e.push(`CFOP de ${i.sku} inválido.`);
    else if ((i.cfop[0] === "5") !== (ufOf(c) === EMIT_UF)) e.push(`CFOP de ${i.sku}: use 5xxx dentro de ${EMIT_UF} e 6xxx para outro estado.`);
  });
  if (!d.modFrete.startsWith("9") && !d.transp.trim()) e.push("Informe a transportadora ou escolha 'Sem frete'.");
  if (!(d.volumes >= 1)) e.push("Volumes deve ser 1 ou mais.");
  return e;
}
function vNfForm() {
  const d = nfDraft; const o = C().orders.find((x) => x.id === d.order); const c = cust(o.customer);
  const errs = nfErrors(d);
  const f = (id, label, val, extra = "") => `<label class="f" for="${id}">${label}<input id="${id}" value="${esc(val)}" ${extra}></label>`;
  const sel = (id, label, val, opts) => `<label class="f" for="${id}">${label}<select id="${id}">${opts.map((x) => `<option ${x === val ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></label>`;
  return `<div class="row"><button class="btn ghost" data-act="nf-cancel">Voltar ao Fiscal</button></div>` +
    head(`Emitir NF-e · pedido ${code(o)}`, `${esc(cust(o.customer).name)} · série ${d.serie} · número ${d.numero} · homologação`) +
    `<div class="card"><h2>1. Operação</h2><div class="form">
      ${f("nf-natureza", "Natureza da operação", d.natureza)}
      ${sel("nf-finalidade", "Finalidade", d.finalidade, ["1 · Normal", "2 · Complementar", "3 · Ajuste", "4 · Devolução"])}
      ${sel("nf-consumidor", "Consumidor final", d.consumidor, ["0 · Não (revenda/empresa)", "1 · Sim"])}
    </div></div>
    <div class="card"><h2>2. Destinatário</h2><div class="form">
      <label class="f">Razão social<input value="${esc(c.name)}" disabled></label>
      <label class="f">CNPJ/CPF<input value="${esc(c.doc)}" disabled></label>
      ${f("nf-ie", "Inscrição estadual", d.ie, 'placeholder="ISENTO se não tiver"')}
      ${f("nf-endereco", "Município/UF", d.endereco)}
      ${f("nf-email", "E-mail para envio do XML", d.email, 'type="email" placeholder="nfe@cliente.com.br"')}
    </div></div>
    <div class="card"><h2>3. Produtos e tributação <small>CFOP sugerido pelo estado do cliente</small></h2>` +
    table([{ t: "SKU" }, { t: "Descrição" }, { t: "NCM" }, { t: "CFOP" }, { t: "CST/CSOSN" }, { t: "Qtd", r: 1 }, { t: "Valor", r: 1 }],
      d.items.map((i, idx) => `<tr><td class="mono">${i.sku}</td><td>${esc(i.name)}</td>
        <td><input aria-label="NCM" data-nfi="${idx}" data-k="ncm" value="${esc(i.ncm)}" style="width:100px"></td>
        <td><input aria-label="CFOP" data-nfi="${idx}" data-k="cfop" value="${esc(i.cfop)}" style="width:70px"></td>
        <td><select aria-label="CST" data-nfi="${idx}" data-k="cst">${CST_OPTS.map(([v, l]) => `<option value="${v}" ${v === i.cst ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></td>
        <td class="r num">${nf.format(i.qty)}</td><td class="r num">${money(i.sub)}</td></tr>`)) +
    `<p class="note" style="margin:10px 0 0">Os valores de ICMS, IPI, PIS e COFINS são calculados pelo provedor fiscal a partir do CST/CSOSN e do regime da empresa (a confirmar com a contabilidade).</p></div>
    <div class="card"><h2>4. Transporte e pagamento</h2><div class="form">
      ${sel("nf-modfrete", "Modalidade do frete", d.modFrete, ["0 · Por conta do emitente (CIF)", "1 · Por conta do destinatário (FOB)", "2 · Por conta de terceiros", "9 · Sem frete"])}
      ${f("nf-transp", "Transportadora", d.transp)}
      ${f("nf-volumes", "Volumes", d.volumes, 'type="number" min="1"')}
      ${f("nf-peso", "Peso bruto (kg)", d.peso, 'type="number" min="0" step="0.001"')}
      ${sel("nf-pag", "Forma de pagamento", d.pag, ["15 · Boleto", "17 · PIX", "03 · Cartão de crédito", "01 · Dinheiro", "90 · Sem pagamento"])}
      <label class="f">Parcelas<input value="${o.inst}x de ${money(o.total / o.inst)}" disabled></label>
      <label class="f span3" for="nf-obs">Informações complementares<textarea id="nf-obs" rows="2">${esc(d.obs)}</textarea></label>
    </div></div>
    <div class="card"><div class="row" style="justify-content:space-between">
      <div><div class="note">Total da nota</div><div class="kpi"><div class="val num">${money(o.total)}</div></div><small class="note">itens ${money(o.itemsTotal)} + frete ${money(o.freight)}</small></div>
      <button class="btn" data-act="nf-emit" ${errs.length ? "disabled" : ""}>${icon("fiscal")}Validar e emitir NF-e</button></div>
      ${errs.length ? `<div class="alert bad" style="margin-top:12px">${icon("alert")}<span>Corrija antes de emitir:<br>${errs.map(esc).join("<br>")}</span></div>` : `<div class="alert good" style="margin-top:12px">${icon("check")}<span>Dados conferidos. Pronto para enviar ao provedor fiscal (homologação).</span></div>`}
    </div>`;
}
function emitFromForm() {

function xmlOf(doc) {

  return `<?xml version="1.0" encoding="UTF-8"?>
<nfeProc versao="4.00">
  <NFe><infNFe Id="NFe${doc.key.replace(/\s/g, "")}">

    <emit><xNome>${esc(C().name)}</xNome><UF>${EMIT_UF}</UF></emit>
    <dest><CNPJ>${c.doc.replace(/\D/g, "")}</CNPJ><xNome>NF-E EMITIDA EM AMBIENTE DE HOMOLOGACAO - SEM VALOR FISCAL</xNome></dest>
${items.map((i, n) => `    <det nItem="${n + 1}"><prod><cProd>${i.sku}</cProd><NCM>${i.ncm}</NCM><CFOP>${i.cfop}</CFOP><qCom>${i.qty}</qCom><vProd>${i.sub.toFixed(2)}</vProd></prod><imposto><ICMS><CSOSN>${i.cst}</CSOSN></ICMS></imposto></det>`).join("\n")}

function vDanfe() {
  const doc = C().docs.find((d) => d.id === S.danfe); const o = C().orders.find((x) => x.id === doc.order); const c = cust(o.customer); const f = doc.fiscal || {};

    head(`NF-e ${doc.n} autorizada`, `Protocolo ${doc.proto} · ${doc.when} · homologação, sem valor fiscal`, pill(["Autorizada", "p-good"])) +

let impDraft = null;
function newImpDraft() {
  const first = C().products.find((p) => !p.kit);
  impDraft = {
    supplier: "Shenzhen Opto Co.", country: "China", invoice: "", date: new Date().toISOString().slice(0, 10), incoterm: "FOB", currency: "USD", rate: 5.42,
    file: null, items: first ? [{ sku: first.sku, qty: 100, price: 2.5, kg: 0.2 }] : [],
    freightFx: 120, insuranceFx: 15, alloc: "VALOR",
    exp: { afrmm: 25, siscomex: 154.23, despachante: 450, armazenagem: 180, freteInterno: 250 },
    tax: { ii: 168.5, ipi: 0, pis: 28.4, cofins: 130.6, icms: 312.9 }, taxInCost: true, inst: 1,
  };
  S.impView = "novo"; render(); window.scrollTo(0, 0);
}
function landed(d) {
  // Valor aduaneiro por item em R$; despesas e tributos rateados pelo critério.
  const fob = d.items.map((i) => i.qty * i.price * d.rate);
  const fobTot = fob.reduce((a, b) => a + b, 0);
  const freightBrl = (d.incoterm === "CIF" ? 0 : (+d.freightFx || 0) + (+d.insuranceFx || 0)) * d.rate;
  const expTot = Object.values(d.exp).reduce((a, b) => a + (+b || 0), 0);
  const taxTot = d.taxInCost ? Object.values(d.tax).reduce((a, b) => a + (+b || 0), 0) : (+d.tax.ii || 0);
  const pool = freightBrl + expTot + taxTot;
  const base = d.items.map((i, k) => d.alloc === "QUANTIDADE" ? i.qty : d.alloc === "PESO" ? i.qty * (+i.kg || 0) : fob[k]);
  const baseTot = base.reduce((a, b) => a + b, 0) || 1;
  const rows = d.items.map((i, k) => { const share = pool * base[k] / baseTot; const total = fob[k] + share; return { ...i, fob: fob[k], share, total, unit: i.qty ? total / i.qty : 0 }; });
  return { rows, fobTot, freightBrl, expTot, taxTot, pool, grand: fobTot + pool, weightMissing: d.alloc === "PESO" && d.items.some((i) => !(+i.kg > 0)) };
}

function saveImp() {
  const d = impDraft; const L = landed(d); const c = C();
  if (!d.invoice.trim() || !d.items.length || !(d.rate > 0) || L.weightMissing) throw new Error("Complete os dados da invoice.");
  if (c.purchases.some((p) => p.invoice === d.invoice.trim() && p.supplier === d.supplier)) throw new Error("Esta invoice já foi registrada para este fornecedor.");
  const n = Math.max(0, ...c.purchases.map((p) => p.n)) + 1;
  const imp = { n, supplier: d.supplier, invoice: d.invoice.trim(), status: "Invoice registrada, aguardando recebimento", total: r2(L.grand), imp: true, detail: JSON.parse(JSON.stringify(d)), landed: L.rows.map((r) => ({ sku: r.sku, qty: r.qty, unit: r.unit })), received: false };
  c.purchases.unshift(imp);
  c.pays.unshift({ id: `imp${n}a`, desc: `${d.supplier} · invoice ${imp.invoice} (${d.currency})`, cat: "Importação", amount: r2(L.fobTot + L.freightBrl), due: days(30), approved: false, paid: 0 });
  c.pays.unshift({ id: `imp${n}b`, desc: `Tributos e despesas da DI · invoice ${imp.invoice}`, cat: "Impostos", amount: r2(L.expTot + Object.values(d.tax).reduce((a, b) => a + (+b || 0), 0)), due: days(2), approved: false, paid: 0 });
  impDraft = null; S.impView = n; toast(`Importação ${n} registrada; 2 contas a pagar criadas para aprovação.`); render();
}

function receiveImp(n) {
  const p = C().purchases.find((x) => x.n === n); if (p.received) throw new Error("Importação já recebida.");
  p.landed.forEach((r, k) => {
    const pr = prod(r.sku); const old = pr.phys;
    // Custo médio ponderado: saldo anterior ao custo antigo + entrada ao custo de importação.
    if (move("Entrada", r.sku, r.qty, `Importação ${n}`, `imp:${n}:${k}`)) pr.cost = Math.round(((pr.cost * old + r.unit * r.qty) / (old + r.qty)) * 10000) / 10000;
  });
  p.received = true; p.status = "Recebida"; toast(`Importação ${n} recebida: estoque e custo médio atualizados.`); render();
}

function custStats(id) {
  const os = C().orders.filter((o) => o.customer === id); const ok = os.filter(billed);
  const since = new Date(); since.setMonth(since.getMonth() - 12);
  const y = ok.filter((o) => new Date(o.date) >= since);

  let body = "";

    const bp = {}; os.forEach((o) => o.items.forEach((i) => { bp[i.sku] = bp[i.sku] || { q: 0, v: 0 }; bp[i.sku].q += i.qty; bp[i.sku].v += i.sub; }));

      table([{ t: "Classe" }, { t: "Produto" }, { t: "Quantidade", r: 1 }, { t: "Faturamento", r: 1 }, { t: "% do total", r: 1 }, { t: "% acumulado" }],
        rows.map(([k, x]) => `<tr class="click" data-prod="${k}"><td><span class="abc abc-${m[k].cls}">${m[k].cls}</span></td><td><div class="who-cell">${thumb(prod(k), 30)}<span>${esc(prod(k).name)}<small>${k}</small></span></div></td><td class="r num">${nf.format(x.q)}</td><td class="r num">${money(x.v)}</td><td class="r num">${(m[k].pct * 100).toFixed(1).replace(".", ",")}%</td><td style="min-width:140px"><div class="mini"><i style="width:${m[k].acc * 100}%;background:var(--grad)"></i></div><small class="note">${(m[k].acc * 100).toFixed(0)}%</small></td></tr>`));
  } else if (tab === "vend") {
    const bs = {}; os.forEach((o) => { bs[o.seller] = bs[o.seller] || { v: 0, n: 0, c: new Set() }; bs[o.seller].v += o.total; bs[o.seller].n++; bs[o.seller].c.add(o.customer); });
    const goal = { "Bruno Alves": 45000, "Carla Mendes": 30000, "Gerente Comercial": 50000 };
    body = table([{ t: "Vendedor" }, { t: "Pedidos", r: 1 }, { t: "Clientes", r: 1 }, { t: "Ticket médio", r: 1 }, { t: "Faturamento 90d", r: 1 }, { t: "Meta 90d" }, { t: "Comissão (3%)", r: 1 }],
      Object.entries(bs).sort((a, b) => b[1].v - a[1].v).map(([n, x]) => { const g = goal[n] || 30000; const pct = x.v / g; return `<tr><td><div class="who-cell">${avatar(n)}<span>${esc(n)}</span></div></td><td class="r num">${x.n}</td><td class="r num">${x.c.size}</td><td class="r num">${money(x.v / x.n)}</td><td class="r num">${money(x.v)}</td><td style="min-width:170px"><div class="mini"><i style="width:${Math.min(100, pct * 100)}%;background:${pct >= 1 ? "var(--good)" : "var(--grad)"}"></i></div><small class="note">${Math.round(pct * 100)}% de ${money(g).replace(",00", "")}</small></td><td class="r num">${money(x.v * 0.03)}</td></tr>`; }));
  } else if (tab === "uf") {
    const bu = {}; os.forEach((o) => { const uf = ufOf(cust(o.customer)) || "-"; bu[uf] = bu[uf] || { v: 0, n: 0 }; bu[uf].v += o.total; bu[uf].n++; });
    const rows = Object.entries(bu).sort((a, b) => b[1].v - a[1].v); const mx = rows[0]?.[1].v || 1; const tot = rows.reduce((s, [, x]) => s + x.v, 0) || 1;
    body = `<div class="card"><h2>Faturamento por estado <small>90 dias · CFOP ${EMIT_UF === "SP" ? "5xxx dentro de SP, 6xxx fora" : ""}</small></h2><div class="list">${rows.map(([uf, x]) => `<div class="hbar"><div class="l"><span><b class="ufb">${uf}</b> ${x.n} pedido(s) ${uf === EMIT_UF ? "· dentro do estado" : "· interestadual"}</span><b class="num">${money(x.v)} <small class="note">${Math.round((x.v / tot) * 100)}%</small></b></div><div class="t"><i style="width:${(x.v / mx) * 100}%;background:var(--grad)"></i></div></div>`).join("")}</div></div>`;
  } else {
    const rows = Object.values(S.companies).map((c) => { const o2 = c.orders.filter((o) => billed(o) && o.status !== "CANCELADO" && new Date(o.date) >= since); const t = o2.reduce((s, o) => s + o.total, 0); return { c, n: o2.length, t, tot: c.orders.filter((o) => new Date(o.date) >= since).length }; });
    body = table([{ t: "Empresa" }, { t: "Pedidos aprovados", r: 1 }, { t: "Faturamento 90d", r: 1 }, { t: "Ticket médio", r: 1 }, { t: "Cotações → pedidos", r: 1 }],
      rows.map(({ c, n, t, tot }) => `<tr><td>${c.code} · ${esc(c.name)}</td><td class="r num">${n}</td><td class="r num">${money(t)}</td><td class="r num">${money(n ? t / n : 0)}</td><td class="r num">${tot ? Math.round((n / tot) * 100) : 0}%</td></tr>`).concat([`<tr><td><b>Consolidado</b></td><td class="r num"><b>${rows.reduce((s, r) => s + r.n, 0)}</b></td><td class="r num"><b>${money(rows.reduce((s, r) => s + r.t, 0))}</b></td><td></td><td></td></tr>`])) +
      `<p class="note">Os registros continuam separados por empresa; aqui só os totais são somados.</p>`;
  }
  return head("Relatórios", `Últimos 90 dias · ${esc(C().name)}${role().own ? " · sua carteira" : ""}`) + `<div class="tabs">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? "on" : ""}">${l}</button>`).join("")}</div>` + body;
}

function go(view) { S.clienteId = null; S.prodSku = null; S.batchErrors = null; S.view = view; S.orderId = null; S.tab = null; S.composing = false; S.danfe = null; S.impView = null; nfDraft = null; impDraft = null; render(); window.scrollTo(0, 0); }

document.addEventListener("click", (ev) => {
  if (ev.target.closest("#bell")) { $("bellbox").hidden = !$("bellbox").hidden; return; }
  if (!ev.target.closest("#bellbox")) $("bellbox").hidden = true;
  const cb = ev.target.closest("[data-sel],[data-selall]");
  if (cb) {
    if (cb.dataset.selall !== undefined) { const ids = [...document.querySelectorAll("[data-sel]")].map((x) => x.dataset.sel); const all = ids.every((id) => PF.sel.has(id)); ids.forEach((id) => (all ? PF.sel.delete(id) : PF.sel.add(id))); }
    else { PF.sel.has(cb.dataset.sel) ? PF.sel.delete(cb.dataset.sel) : PF.sel.add(cb.dataset.sel); }
    return render();
  }

  const ds = t.dataset; const o = S.orderId && C().orders.find((x) => x.id === S.orderId);
  try {
    if (ds.go) return go(ds.go);
    if (ds.tab) { S.tab = ds.tab; return render(); }
    if (ds.open || t.closest("[data-open]")) { const id = ds.open || t.closest("[data-open]").dataset.open; S.view = "pedidos"; S.orderId = id; S.composing = false; render(); return window.scrollTo(0, 0); }
    if (ds.act === "novo") { return startDraft(); }

    if (ds.act === "novo-painel") { return newSale(); }
    if (ds.cli) { S.view = "clientes"; S.clienteId = ds.cli; S.orderId = null; render(); return window.scrollTo(0, 0); }
    if (ds.act === "cli-back") { S.clienteId = null; return render(); }
    if (ds.newfor) { const id = ds.newfor; go("pedidos"); startDraft(); draft.customer = id; return render(); }
    if (ds.prod !== undefined && ds.prod) { S.view = "produtos"; S.prodSku = ds.prod; render(); return window.scrollTo(0, 0); }
    if (ds.act === "prod-back") { S.prodSku = null; return render(); }
    if (ds.fam !== undefined) { PRF.fam = ds.fam; return render(); }
    if (ds.sort) { PF.dir = PF.sort === ds.sort ? -PF.dir : -1; PF.sort = ds.sort; return render(); }
    if (ds.page) { PF.page += +ds.page; return render(); }
    if (ds.bulk) { if (ds.bulk === "clear") { PF.sel.clear(); return render(); } return bulk(ds.bulk); }
    if (ds.alert !== undefined) { const a = window.__alerts[+ds.alert]; $("bellbox").hidden = true; go(a[2]); if (a[3]) { S.tab = a[3]; render(); } return; }
    if (ds.act === "salvar-enviar") { return saveDraft(true); }
    if (ds.repeat) { const src = C().orders.find((x) => x.id === ds.repeat); draft.items = src.items.map((i) => ({ sku: i.sku, qty: i.qty, price: prod(i.sku).price, disc: 0, obs: "" })); toast(`Itens de ${code(src)} copiados com o preço de tabela atual.`); return render(); }
    if (ds.act === "nf-all") { return emitAllPending(); }
    if (ds.adv1) { return advanceMany([ds.adv1]); }
    if (ds.advall) { return advanceMany(C().orders.filter((o) => o.status === ds.advall).map((o) => o.id)); }
    if (ds.act === "descartar") { S.composing = false; draft = null; return render(); }
    if (ds.act === "salvar") { return saveDraft(false); }
    if (ds.rm !== undefined) { draft.items.splice(+ds.rm, 1); return render(); }
    if (ds.act === "voltar") { S.orderId = null; return render(); }
    if (ds.o === "submit") { submit(o); return render(); }
    if (ds.o === "approve") { approve(o); return render(); }
    if (ds.o === "nf") { return openNfForm(o); }
    if (ds.o === "adv") { advance(o, ds.to); return render(); }
    if (ds.o === "cancel") { cancel(o, $("cancel-reason").value); return render(); }
    if (ds.nf) { return openNfForm(C().orders.find((x) => x.id === ds.nf)); }
    if (ds.act === "nf-cancel") { nfDraft = null; return render(); }
    if (ds.act === "nf-emit") { return emitFromForm(); }
    if (ds.danfe) { S.danfe = ds.danfe; render(); return window.scrollTo(0, 0); }
    if (ds.act === "danfe-close") { S.danfe = null; return render(); }
    if (ds.act === "imp-new") { return newImpDraft(); }
    if (ds.act === "imp-back") { impDraft = null; S.impView = null; return render(); }
    if (ds.act === "imp-add") { const p0 = C().products.find((p) => !p.kit); impDraft.items.push({ sku: p0.sku, qty: 1, price: 0, kg: 0 }); return render(); }
    if (ds.imrm !== undefined) { impDraft.items.splice(+ds.imrm, 1); return render(); }
    if (ds.act === "imp-save") { return saveImp(); }

    if (ds.imprecv) { return receiveImp(+ds.imprecv); }
    if (ds.pay) { payRecv(C().recv.find((r) => r.id === ds.pay), Number($(`pay-${ds.pay}`).value)); return render(); }
    if (ds.papprove) { C().pays.find((p) => p.id === ds.papprove).approved = true; toast("Pagamento aprovado pela Diretoria."); return render(); }
    if (ds.ppay) { const p = C().pays.find((x) => x.id === ds.ppay); p.paid = p.amount; toast("Pagamento registrado."); return render(); }
    if (ds.reproc) { const e = C().events.find((x) => x.key === ds.reproc); e.attempts = (e.attempts || 1) + 1; e.msg = `Tentativa ${e.attempts}: anúncio ainda sem vínculo de SKU. Vincule o anúncio e reprocesse.`; toast("Reprocessado: continua com erro até o anúncio ser vinculado."); return render(); }
    if (ds.act === "mov") {
      const qty = Math.floor(Number($("m-qty").value)); const reason = $("m-reason").value.trim();
      if (!(qty > 0)) throw new Error("Quantidade deve ser maior que zero.");

      move($("m-type").value, $("m-sku").value, qty, reason); toast("Movimento registrado e auditado."); return render();
    }
  } catch (e) { err(e); }
});

    if (el.id === "e-price") { e.price = Math.max(0, +el.value || 0); e.priceTyped = true; }
    if (el.id === "e-obs") e.obs = el.value;
    if (el.id === "e-entrega") draft.entrega = el.value;
    if (el.id === "e-tipo") { draft.tipo = el.value; setTimeout(render, 0); }

  }
  if (!draft || el.id === "q-sku") return;
  if (el.id === "q-cust") { draft.customer = el.value; }
  if (el.id === "q-inst") { draft.inst = +el.value; }
  if (el.id === "q-freight") { draft.freight = Math.max(0, Number(el.value) || 0); }

document.addEventListener("keydown", (ev) => {

// ---------------------------------------------------------------------------
// Barra de comandos: busca módulos, pedidos, produtos e clientes, e executa
// comandos ("aprovar A-00002", "emitir nf A-00002", "nova cotação").
// ---------------------------------------------------------------------------
let cmdItems = []; let cmdSel = 0;
const norm = (t) => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function findOrder(txt) {
  const m = txt.match(/([ab])-?0*(\d+)/i); if (!m) return null;
  if (m[1].toUpperCase() !== C().code) return null;
  return C().orders.find((o) => o.n === +m[2]) || null;
}
function buildCmd(q) {
  const t = norm(q.trim()); const out = [];
  if (!t) {
    out.push({ g: "Sugestões", label: "Lançar Pedido de Saída", hint: "comando", run: () => newSale() });
    const pendO = C().orders.find((o) => o.status === "AGUARDANDO");
    if (pendO) out.push({ g: "Sugestões", label: `Aprovar ${code(pendO)}`, hint: "aguardando aprovação", run: () => runCmd(`aprovar ${code(pendO)}`) });
    [["Pedido de Saída", "Consultar Pedidos"], ["A Receber", "Baixa de Contas a Receber"], ["A Pagar", "Baixa de Contas a Pagar"], ["Movimentação", "NF-e / NFC-e / SAT"], ["Pedido de Entrada", "Lançar Pedido de Entrada"]].forEach(([m, l]) => {
      const menu = MENUS.find((x) => x[0] === m); const it = menu && menu[2].find((x) => x !== "-" && x[0] === l);
      if (it && (menu[1] === "*" || can(menu[1]))) out.push({ g: "Funções", label: l, hint: m, run: it[1] });
    });
    return out;
  }
  const verb = t.split(/\s+/)[0];
  const o = findOrder(t);
  if (o && ["aprovar", "emitir", "nf", "abrir", "cancelar", "separar", "despachar"].includes(verb)) {
    const label = { aprovar: "Aprovar", emitir: "Emitir NF-e de", nf: "Emitir NF-e de", abrir: "Abrir", cancelar: "Abrir para cancelar", separar: "Abrir para separar", despachar: "Abrir para despachar" }[verb];
    out.push({ g: "Comando", label: `${label} ${code(o)}`, hint: esc(cust(o.customer).name), run: () => runCmd(t) });
  }
  if (can("compras") && (t.includes("import") || t.includes("invoice"))) out.push({ g: "Comando", label: "Nova importação (invoice)", hint: "compras", run: () => { go("compras"); newImpDraft(); } });
  if (verb.startsWith("nova") || verb.startsWith("novo") || t.includes("cotacao")) out.push({ g: "Comando", label: "Lançar Pedido de Saída", hint: "comando", run: () => newSale() });
  MODULES.filter(([k, l]) => can(k) && norm(l).includes(t)).forEach(([k, l]) => out.push({ g: "Módulos", label: l, hint: "abrir", run: () => go(k) }));
  // Funções com os nomes do sistema atual (IUVEN): "baixa contas a pagar", "lançar pedido de saída"...
  MENUS.filter(([, mod]) => mod === "*" || can(mod)).forEach(([menu, , items]) => items.forEach((it) => {
    if (it !== "-" && matchWords(`${menu} ${it[0]}`, q)) out.push({ g: "Funções", label: it[0], hint: menu + (it[2] ? ` · ${it[2]}` : ""), run: it[1] });
  }));
  if (can("pedidos")) visibleOrders().filter((x) => norm(`${code(x)} ${cust(x.customer).name}`).includes(t.replace(/^abrir\s+/, ""))).slice(0, 5)
    .forEach((x) => out.push({ g: "Pedidos", label: `${code(x)} · ${cust(x.customer).name}`, hint: STATUS[x.status][0], run: () => { S.view = "pedidos"; S.orderId = x.id; render(); } }));
  if (can("clientes")) myCustomers().filter((c) => matchWords(`${c.id} ${c.name} ${c.doc} ${c.city}`, q)).slice(0, 4).forEach((c) => out.push({ g: "Clientes", label: c.name, hint: `${c.doc} · ${c.city}`, run: () => { S.view = "clientes"; S.clienteId = c.id; render(); } }));
  if (can("produtos")) C().products.filter((p) => norm(`${p.sku} ${p.name}`).includes(t)).slice(0, 5)
    .forEach((p) => out.push({ g: "Produtos", label: `${p.sku} · ${p.name}`, hint: `${nf.format(avail(p))} disponíveis`, run: () => { S.view = "produtos"; S.prodSku = p.sku; render(); } }));
  return out;
}
function runCmd(t) {
  const verb = norm(t).split(/\s+/)[0]; const o = findOrder(t);
  if (!o) throw new Error("Pedido não encontrado nesta empresa.");
  S.view = "pedidos"; S.orderId = o.id;
  if (verb === "aprovar") { if (o.status !== "AGUARDANDO") throw new Error(`${code(o)} não está aguardando aprovação.`); approve(o); }
  else if (verb === "emitir" || verb === "nf") { return openNfForm(o); }

}
function showCmd() {
  const box = $("cmdres"); cmdItems = buildCmd($("cmd").value); cmdSel = 0;
  if (!cmdItems.length) { box.innerHTML = `<div class="empty">Nada encontrado. Tente um número de pedido, SKU, cliente ou "aprovar A-00002".</div>`; box.hidden = false; return; }
  let last = ""; box.innerHTML = cmdItems.map((it, i) => { const g = it.g !== last ? `<div class="grp">${it.g}</div>` : ""; last = it.g; return `${g}<button type="button" data-cmd="${i}" class="${i === 0 ? "sel" : ""}">${esc(it.label)}<small>${it.hint}</small></button>`; }).join("");
  box.hidden = false;
}
function hideCmd() { $("cmdres").hidden = true; }
function execCmd(i) { const it = cmdItems[i]; if (!it) return; hideCmd(); $("cmd").value = ""; $("cmd").blur(); try { it.run(); } catch (e) { toast(e.message); } }
$("cmd").addEventListener("focus", showCmd);
$("cmd").addEventListener("input", showCmd);
$("cmd").addEventListener("keydown", (ev) => {
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault(); if (!cmdItems.length) return;
    cmdSel = (cmdSel + (ev.key === "ArrowDown" ? 1 : -1) + cmdItems.length) % cmdItems.length;
    $("cmdres").querySelectorAll("button").forEach((b, i) => b.classList.toggle("sel", i === cmdSel));
  } else if (ev.key === "Enter") { ev.preventDefault(); execCmd(cmdSel); }
  else if (ev.key === "Escape") { hideCmd(); $("cmd").blur(); }
});
$("cmdres").addEventListener("mousedown", (ev) => { const b = ev.target.closest("[data-cmd]"); if (b) { ev.preventDefault(); execCmd(+b.dataset.cmd); } });
$("cmd").addEventListener("blur", () => setTimeout(hideCmd, 120));
document.addEventListener("keydown", (ev) => { if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); $("cmd").focus(); } });

S = seed();
render();
